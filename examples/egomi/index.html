<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website collection</title>
    <script type="module" src="/src/reference-viewer.js"></script>
  </head>
  <body data-reference="egomi">
    <header class="reference-toolbar">
      <a id="back-link" href="../../">← Collection</a>
      <h1 id="reference-name"></h1>
      <a id="original-link" target="_blank" rel="noopener noreferrer"
        >Open original ↗</a
      >
      <details class="reference-details">
        <summary id="reference-note-toggle">About this view</summary>
        <p id="reference-note"></p>
      </details>
    </header>
    <iframe
      id="reference-frame"
      title="Original project website"
      allow="fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </body>
</html>
