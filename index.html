<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta
      name="description"
      content="A collection of research websites and interactive demos by Shuaijun."
    />
    <title>Website collection — Shuaijun</title>
    <link rel="icon" type="image/svg+xml" href="./collection.svg" />
    <script type="module" src="/src/collection.js"></script>
  </head>
  <body>
    <a class="skip" href="#examples" data-i18n="skip">Skip to projects</a>
    <div class="collection-shell">
      <header class="collection-header">
        <a class="collection-brand" href="./" aria-label="Collection home">
          <span class="collection-mark" aria-hidden="true"
            ><i></i><i></i><i></i
          ></span>
          <span>Shuaijun</span>
        </a>
        <nav aria-label="Main navigation">
          <a class="projects-link" href="#examples" data-i18n="projects"
            >Projects</a
          >
          <div class="language-switcher" role="group" aria-label="Language">
            <button
              type="button"
              data-language="en"
              lang="en"
              aria-label="English"
              aria-pressed="true"
            >
              EN
            </button>
            <button
              type="button"
              data-language="zh"
              lang="zh-CN"
              aria-label="中文"
              aria-pressed="false"
            >
              中文
            </button>
          </div>
        </nav>
      </header>
      <main>
        <section class="collection-intro" aria-labelledby="collection-title">
          <h1 id="collection-title">
            <span data-i18n="titleFirst">Website</span
            ><span class="title-second"
              ><span data-i18n="titleSecond">collection</span
              ><span class="title-dot" aria-hidden="true">.</span></span
            >
          </h1>
          <p class="intro-description" data-i18n="intro">
            Research pages and interactive demos, collected in one place.
          </p>
        </section>
        <section
          id="examples"
          class="examples"
          aria-labelledby="examples-title"
        >
          <div class="section-heading">
            <h2 id="examples-title" data-i18n="projects">Projects</h2>
            <span data-example-count>11</span>
          </div>
          <div id="example-list"></div>
          <noscript
            ><a href="./examples/fieldwork/">FIELDWORK</a> ·
            <a href="./examples/brace/">BRACE</a> ·
            <a href="./examples/d-jepa/">D-JEPA</a> ·
            <a href="./examples/mimicx/">MimicX</a> ·
            <a href="./examples/robot-studio/">Robot Studio</a> ·
            <a href="./examples/warp-rm/">WARP-RM</a> ·
            <a href="./examples/egomi-r2r/">EgoMI / Real2Render2Real</a> ·
            <a href="./examples/cap-x/">CaP-X</a> ·
            <a href="./examples/josephines-world/">Josephine’s World</a> ·
            <a href="./examples/synesthesia/">Synesthesia</a> ·
            <a href="./examples/pocket-grove/">Pocket Grove</a></noscript
          >
        </section>
      </main>
      <footer class="collection-footer">
        <span>Shuaijun</span><a href="#" data-i18n="backTop">Back to top ↑</a>
      </footer>
    </div>
  </body>
</html>
